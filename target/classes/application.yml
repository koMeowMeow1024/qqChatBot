spring:
  application:
    name: qq-chat-bot

server:
  port: 8080

bot:
  qq:
    enabled: true
    one-bot-web-socket-url: ${ONEBOT_WS_URL:ws://127.0.0.1:3001/}
    access-token: ${ONEBOT_ACCESS_TOKEN:}
# 模型配置通过环境变量提供，避免把密钥提交到 GitHub
langchain4j:
  open-ai:
    chat-model:
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_MODEL_NAME:gpt-4o-mini}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}