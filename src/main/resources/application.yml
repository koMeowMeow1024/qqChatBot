spring:
  application:
    name: qq-chat-bot
  datasource:
    # busy_timeout 避免并发写立即报 SQLITE_BUSY，WAL 提升读写并发
    url: "jdbc:sqlite:qq-chat-bot.db?busy_timeout=5000&journal_mode=WAL"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 同一时刻只允许一个写者，单连接最稳
      maximum-pool-size: 1
  sql:
    init:
      mode: always

server:
  port: 8080

bot:
  qq:
    enabled: true
    one-bot-web-socket-url: ${ONEBOT_WS_URL:ws://127.0.0.1:3001/}
    access-token: ${ONEBOT_ACCESS_TOKEN:}
    self-id: 3761101415
  limits:
    context-max-messages: ${BOT_CONTEXT_MAX_MESSAGES:10}
    context-max-chars: ${BOT_CONTEXT_MAX_CHARS:8000}
    image-max-bytes-per-image: ${BOT_IMAGE_MAX_BYTES_PER_IMAGE:5242880}
    image-max-total-bytes: ${BOT_IMAGE_MAX_TOTAL_BYTES:8388608}

# 模型配置通过环境变量提供，避免把密钥提交到 GitHub
ai:
  dashscope:
    model: ${DASHSCOPE_MODEL:qwen3.7-flash}
    reply-timeout-seconds: ${DASHSCOPE_REPLY_TIMEOUT_SECONDS:90}
